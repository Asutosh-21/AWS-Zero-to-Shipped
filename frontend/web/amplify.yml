version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend/web
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/web/.next
    files:
      - '**/*'
  cache:
    paths:
      - frontend/web/node_modules/**/*
      - frontend/web/.next/cache/**/*
